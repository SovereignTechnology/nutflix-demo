# sysusers.d(5) — dedicated, unprivileged, no-login accounts for the Nutflix daemons.
# Install: cp nutflix.sysusers.conf /etc/sysusers.d/nutflix.conf && systemd-sysusers
# One account per daemon so a compromised gateway cannot read the seeder's state
# (StateDirectoryMode=0700 in the units makes that boundary real).
#Type Name             ID  GECOS                 Home directory             Shell
u     nutflix-seeder   -   "Nutflix seeder"      /var/lib/nutflix-seeder    /usr/sbin/nologin
u     nutflix-gateway  -   "Nutflix gateway"     /var/lib/nutflix-gateway   /usr/sbin/nologin
