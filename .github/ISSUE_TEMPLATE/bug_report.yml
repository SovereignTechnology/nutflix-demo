name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the [known limitations](https://github.com/SovereignTechnology/nutflix-pear#known-limitations) first, and **do not use this form for a security vulnerability**: see [SECURITY.md](https://github.com/SovereignTechnology/nutflix-pear/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - .deb package
        - AppImage
        - From source (npm start, the offline demo)
        - Seeder or gateway daemon
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release (for example 0.1.0) or the commit you built.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Remove anything private first, such as keys, tokens, invoices and public keys you want to keep to yourself.
      render: shell
